<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>手勢圖片播放器</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="app-shell"><header><p class="eyebrow">GESTURE GALLERY</p><h1>手勢圖片播放器</h1><p class="subtitle">開啟攝影機後，以手勢或按鈕控制圖片播放。</p></header><section class="workspace" aria-label="手勢控制工作區">
<article class="panel"><div class="panel-heading"><h2>攝影機</h2><span id="cameraStatus" class="status">尚未啟動</span></div><div class="camera-stage"><video id="webcam" autoplay playsinline muted></video><canvas id="overlay"></canvas><div id="cameraHint" class="camera-hint">按下「啟動攝影機」以開始</div></div><div class="camera-actions"><button id="startCamera" class="primary" type="button">啟動攝影機</button><button id="stopCamera" class="secondary" type="button" disabled>停止視訊</button></div><details class="gesture-reference" open><summary>手勢指令參考</summary><ul><li>張開手掌向左移動：上一張</li><li>張開手掌向右移動：下一張</li><li>單獨伸出食指：第一張</li><li>單獨伸出小指：最後一張</li><li>手心／手背翻轉：圖片左右鏡像</li><li>單獨大拇指比讚：切換黑白負片</li><li>雙手食指交叉成 X：疾風忍者能量特效</li><li>雙手合掌：墨跡逐字與天體封印特效</li></ul></details></article>
<article class="panel"><div class="panel-heading"><h2>圖片展示</h2><span id="slideCounter" class="status">1 / 5</span></div><figure class="slide-frame"><img id="slideImage" src="/static/images/slide-1.svg" alt="展示圖片 1"><div id="celestialDebris" class="celestial-debris" aria-hidden="true"></div><div id="inkChant" class="ink-chant" aria-live="polite"></div><figcaption id="slideTitle">晨光山景</figcaption></figure><div class="controls"><button id="firstButton" type="button">第一張</button><button id="previousButton" type="button">← 上一張</button><button id="nextButton" type="button">下一張 →</button><button id="lastButton" type="button">最後一張</button></div><p id="gestureMessage" class="gesture-message" aria-live="polite">等待手勢輸入</p></article>
</section></main><script type="module" src="/static/app.js"></script></body></html>
